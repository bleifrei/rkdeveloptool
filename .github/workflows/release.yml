name: release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    # ubuntu-24.04 (LTS, x86-64 baseline), not ubuntu-latest: the newer 25.x
    # images use a x86-64-v3 toolchain (GCC 15), whose startup objects put an
    # "x86 ISA needed: x86-64-v3" note in the binary so it refuses to run on
    # pre-AVX2 CPUs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libusb-1.0-0-dev libudev-dev

      - name: Build
        run: |
          ./autogen.sh
          # Makefile.am adds -Wall -Werror -Wextra; newer GCC trips on old code,
          # so keep the warnings but not as errors (CXXFLAGS comes after AM_CPPFLAGS).
          # -O2 because passing CXXFLAGS replaces configure's default "-g -O2";
          # -march=x86-64 keeps the binary portable (runner GCC defaults to v3).
          ./configure CXXFLAGS="-O2 -Wno-error -march=x86-64 -mtune=generic" \
                      CFLAGS="-O2 -Wno-error -march=x86-64 -mtune=generic"
          make -j"$(nproc)"
          file rkdeveloptool
          ldd rkdeveloptool || true
          # Guard: fail if the toolchain leaked an x86-64-v3 requirement, which
          # would make the binary refuse to run on pre-AVX2 CPUs.
          if readelf -n rkdeveloptool | grep -q 'x86-64-v3'; then
            echo "error: rkdeveloptool requires x86-64-v3 (wrong runner image?)" >&2
            exit 1
          fi

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
          name="rkdeveloptool-${ver}-linux-x86_64"
          strip --strip-unneeded rkdeveloptool
          mkdir -p "$name"
          cp rkdeveloptool "$name"/
          [ -f 99-rk-rockusb.rules ] && cp 99-rk-rockusb.rules "$name"/ || true
          [ -f Readme.txt ] && cp Readme.txt "$name"/ || true
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkdeveloptool-linux-x86_64
          path: |
            rkdeveloptool-*.tar.gz
            rkdeveloptool-*.tar.gz.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rkdeveloptool-*.tar.gz
            rkdeveloptool-*.tar.gz.sha256
          generate_release_notes: true
