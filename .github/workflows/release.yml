name: release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libusb-1.0-0-dev libudev-dev

      - name: Build
        run: |
          ./autogen.sh
          # Makefile.am adds -Wall -Werror -Wextra; newer GCC trips on old code,
          # so keep the warnings but not as errors (CXXFLAGS comes after AM_CPPFLAGS).
          flags='CXXFLAGS=-Wno-error CFLAGS=-Wno-error'
          # Prefer a fully static binary (no libusb/libudev runtime deps); fall
          # back to a dynamic build if the static libraries aren't available.
          if ./configure $flags LDFLAGS="-static" && make -j"$(nproc)"; then
            echo "static build"
          else
            make distclean || true
            ./configure $flags
            make -j"$(nproc)"
          fi
          file rkdeveloptool
          (ldd rkdeveloptool || echo "statically linked")

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
          name="rkdeveloptool-${ver}-linux-x86_64"
          mkdir -p "$name"
          cp rkdeveloptool "$name"/
          [ -f 99-rk-rockusb.rules ] && cp 99-rk-rockusb.rules "$name"/ || true
          [ -f Readme.txt ] && cp Readme.txt "$name"/ || true
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkdeveloptool-linux-x86_64
          path: |
            rkdeveloptool-*.tar.gz
            rkdeveloptool-*.tar.gz.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rkdeveloptool-*.tar.gz
            rkdeveloptool-*.tar.gz.sha256
          generate_release_notes: true
